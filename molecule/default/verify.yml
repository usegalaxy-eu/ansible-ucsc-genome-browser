---
- name: Ensure UCSC Genome Browser is installed
  hosts: all
  vars_files:
    - vars.yml
  tasks:
    - name: Check if UCSC Genome Browser is already installed
      block:
        - name: Stat UCSC Genome Browser installation flag
          ansible.builtin.stat:
            path: "/usr/local/apache/cgiInstallComplete.flag"
          register: ucsc_genome_browser_installation_flag

        - name: Assert UCSC Genome Browser installation flag exists
          ansible.builtin.assert:
            that: ucsc_genome_browser_installation_flag.stat.exists
            fail_msg: "UCSC Genome Browser installation flag not found. Installation may have failed."

    - name: Ensure `/gbdb/` is a directory
      # "Work around `GBDBDIR` setting being ignored by the installation script" should have been skipped
      block:
        - name: Stat `/gbdb/` directory
          ansible.builtin.stat:
            path: /gbdb/
          register: gbdb_dir_stat

        - name: Assert that `/gbdb/` exists and is a directory
          ansible.builtin.assert:
            that:
              - gbdb_dir_stat.stat.exists
              - gbdb_dir_stat.stat.isdir
            fail_msg: "`/gbdb/` is not a directory. It should be a directory."

    - name: Ensure hg.conf settings have been applied
      block:
        - name: Read hg.conf file
          ansible.builtin.slurp:
            src: "{{ ucsc_genome_browser_setting_CGIBINDIR }}/hg.conf"
          register: hg_conf_slurp

        - name: Decode hg.conf content
          ansible.builtin.set_fact:
            hg_conf_decoded: "{{ hg_conf_slurp.content | b64decode }}"

        - name: Assert hg.conf settings
          ansible.builtin.assert:
            that: "hg_conf_decoded is search('^{{ item.key }}={{ item.value }}$', multiline=True)"
            fail_msg: "One or more hg.conf settings are missing or incorrect."
          loop: "{{ ucsc_genome_browser_hg_conf_settings | dict2items }}"

    - name: Ensure the Plausible analytics script is set up
      block:
        - name: Stat the Plausible analytics script
          ansible.builtin.stat:
            path: "{{ ucsc_genome_browser_setting_APACHEDIR }}/htdocs/js/plausible.js"
          register: plausible_js_stat

        - name: Assert the script exists and hg.conf loads it
          ansible.builtin.assert:
            that:
              - plausible_js_stat.stat.exists
              - hg_conf_decoded is search('^addJs=plausible.js$', multiline=True)
            fail_msg: "plausible.js is missing or not loaded via `addJs` in hg.conf."

    - name: Ensure private hg.conf settings have been applied
      become: true
      block:
        - name: Read hg.conf.private file
          ansible.builtin.slurp:
            src: "{{ ucsc_genome_browser_setting_CGIBINDIR }}/hg.conf.private"
          register: hg_conf_private_slurp

        - name: Stat hg.conf.private file
          ansible.builtin.stat:
            path: "{{ ucsc_genome_browser_setting_CGIBINDIR }}/hg.conf.private"
          register: hg_conf_private_stat

        - name: Assert hg.conf.private is included, readable only by Apache and holds the settings
          ansible.builtin.assert:
            that:
              - hg_conf_decoded is search('^include hg.conf.private$', multiline=True)
              - hg_conf_private_stat.stat.mode == "0640"
              - hg_conf_private_stat.stat.gr_name == "apache"
              - (hg_conf_private_slurp.content | b64decode) == "login.cookieSalt=molecule-salt\n"
            fail_msg: "hg.conf.private is missing, not included, or has wrong permissions or content."

    - name: Ensure FreeType font support is enabled
      vars:
        freetype_dir_setting: "{{ hg_conf_decoded | regex_search('^freeTypeDir=(.+)$', '\\1', multiline=True) | first }}"
        # relative to the CGI directory
        freetype_dir: "{{ freetype_dir_setting if freetype_dir_setting.startswith('/') else ucsc_genome_browser_setting_CGIBINDIR ~ '/' ~ freetype_dir_setting }}"
      block:
        - name: Assert FreeType is turned on in hg.conf
          ansible.builtin.assert:
            that:
              - hg_conf_decoded is search('^freeType=on$', multiline=True)
              - hg_conf_decoded is search('^freeTypeDir=.+$', multiline=True)
            fail_msg: "hg.conf does not turn on FreeType font rendering or does not set the font directory."

        - name: Stat FreeType font directory
          ansible.builtin.stat:
            path: "{{ freetype_dir }}"
          register: freetype_dir_stat

        - name: Assert FreeType font directory exists
          ansible.builtin.assert:
            that:
              - freetype_dir_stat.stat.exists
              - freetype_dir_stat.stat.isdir
            fail_msg: "FreeType font directory {{ freetype_dir }} not found."

    - name: Ensure API is served via short URLs, as on the public website
      block:
        - name: Query a non-API path
          ansible.builtin.uri:
            url: http://localhost/nonexistent-api-path
            follow_redirects: none
            status_code: 404
          register: api_non_api_response

        - name: Query the API through its CGI program
          ansible.builtin.uri:
            url: http://localhost/cgi-bin/hubApi/list/ucscGenomes
            return_content: true
          register: api_cgi_response

        - name: Query the API through its short URL
          ansible.builtin.uri:
            url: http://localhost/list/ucscGenomes
            return_content: true
            follow_redirects: none
          register: api_short_url_response

        - name: Assert the short URL answers the same as the CGI program and allows cross-origin requests
          ansible.builtin.assert:
            that:
              - api_non_api_response.status == 404  # non-API paths should not work
              - api_short_url_response.status == 200
              - "'ucscGenomes' in api_short_url_response.json"
              - api_short_url_response.json.ucscGenomes == api_cgi_response.json.ucscGenomes
              - api_short_url_response.access_control_allow_origin == "*"
            fail_msg: "`/list/ucscGenomes` does not answer the same as `/cgi-bin/hubApi/list/ucscGenomes`, or lacks CORS headers or non-API path does not return 404."

        - name: Query a non-API path on the API subdomain
          ansible.builtin.uri:
            url: http://localhost/nonexistent-api-path
            headers:
              Host: api.genome-browser
            follow_redirects: none
            status_code: 302
          register: api_subdomain_catch_all_response

        - name: Query the API through its CGI program on API subdomain
          ansible.builtin.uri:
            url: http://localhost/cgi-bin/hubApi/list/ucscGenomes
            headers:
              Host: api.genome-browser
            return_content: true
          register: api_subdomain_cgi_response

        - name: Query the API through its short URL on API subdomain
          ansible.builtin.uri:
            url: http://localhost/list/ucscGenomes
            headers:
              Host: api.genome-browser
            return_content: true
            follow_redirects: none
          register: api_subdomain_short_url_response

        - name: Assert the API subdomain serves the API and its documentation
          ansible.builtin.assert:
            that:
              - api_subdomain_catch_all_response.location == "http://genome-browser/goldenPath/help/api.html"
              - api_subdomain_cgi_response.status == 200
              - api_subdomain_short_url_response.status == 200
              - api_subdomain_short_url_response.json.ucscGenomes == api_cgi_response.json.ucscGenomes
              - api_subdomain_short_url_response.access_control_allow_origin == "*"
            fail_msg: "The `api.` subdomain does not serve the API, its CORS headers, or the API documentation, or the catch-all leaks onto the main hostname."

    - name: Ensure the software update timer is enabled and running
      block:
        - name: Get software update timer state
          ansible.builtin.systemd_service:
            name: ucsc-genome-browser-cgi-updater.timer
          register: cgi_update_timer

        - name: Assert the software update timer is enabled and running
          ansible.builtin.assert:
            that:
              - cgi_update_timer.status.UnitFileState == "enabled"
              - cgi_update_timer.status.ActiveState == "active"
            fail_msg: "The software update timer should be enabled by default."

    - name: Ensure the trash cleaner timer is enabled and running
      block:
        - name: Get trash cleaner timer state
          ansible.builtin.systemd_service:
            name: ucsc-genome-browser-trash-cleaner.timer
          register: clean_timer

        - name: Assert the trash cleaner timer is enabled and running
          ansible.builtin.assert:
            that:
              - clean_timer.status.UnitFileState == "enabled"
              - clean_timer.status.ActiveState == "active"
            fail_msg: "The trash cleaner timer is not enabled and active."

    - name: Ensure the trash cleaner removes stale files
      become: true
      block:
        - name: Create a stale file in the trash directory
          ansible.builtin.file:
            path: "{{ ucsc_genome_browser_setting_TRASHDIR }}/molecule-stale-file"
            state: touch
            access_time: "202001010000.00"
            modification_time: "202001010000.00"

        - name: Run the trash cleaner
          ansible.builtin.systemd_service:
            name: ucsc-genome-browser-trash-cleaner.service
            state: started

        - name: Stat the stale file
          ansible.builtin.stat:
            path: "{{ ucsc_genome_browser_setting_TRASHDIR }}/molecule-stale-file"
          register: stale_file_stat

        - name: Assert the stale file was removed
          ansible.builtin.assert:
            that: not stale_file_stat.stat.exists
            fail_msg: "The trash cleaner did not remove a file older than one day."

    - name: Ensure the backup service backs up user data and removes old backups
      become: true
      vars:
        backup_dir: /var/backups/ucsc-genome-browser
      block:
        - name: Get backup timer state
          ansible.builtin.systemd_service:
            name: ucsc-genome-browser-backup.timer
          register: backup_timer

        - name: Ensure the custom track directory exists
          ansible.builtin.file:
            path: "{{ ucsc_genome_browser_setting_TRASHDIR }}/ct"
            state: directory
            mode: "0755"

        - name: Create an old backup
          ansible.builtin.file:
            path: "{{ backup_dir }}/molecule-old-backup"
            state: touch
            access_time: "202001010000.00"
            modification_time: "202001010000.00"

        - name: Run the backup service  # fails if the dump fails
          ansible.builtin.systemd_service:
            name: ucsc-genome-browser-backup.service
            state: started

        - name: Find backups
          ansible.builtin.find:
            paths: "{{ backup_dir }}"
          register: backups

        - name: Assert the backup timer is enabled and the backups were made
          vars:
            names: "{{ backups.files | map(attribute='path') | map('basename') | list }}"
          ansible.builtin.assert:
            that:
              - backup_timer.status.UnitFileState == "enabled"
              - backup_timer.status.ActiveState == "active"
              - names | select('match', 'databases-.*\\.sql\\.gz$') | length == 1
              - names | select('match', 'ct-.*\\.tar\\.gz$') | length == 1
              - "'molecule-old-backup' not in names"
            fail_msg: "The backup timer is not active, a backup is missing, or an old backup was not removed."

    - name: Ensure the custom track cleaner removes stale custom tracks
      become: true
      block:
        - name: Get custom track cleaner timer state
          ansible.builtin.systemd_service:
            name: ucsc-genome-browser-custom-track-cleaner.timer
          register: custom_track_clean_timer

        - name: Ensure the custom track directory exists
          ansible.builtin.file:
            path: "{{ ucsc_genome_browser_setting_TRASHDIR }}/ct"
            state: directory
            mode: "0755"

        - name: Create a stale custom track file
          ansible.builtin.file:
            path: "{{ ucsc_genome_browser_setting_TRASHDIR }}/ct/molecule-stale-file"
            state: touch
            access_time: "202001010000.00"
            modification_time: "202001010000.00"

        - name: Create a stale custom track table
          ansible.builtin.command:
            cmd: >-
              mysql customTrash -e "CREATE TABLE molecule_stale_ct (id int);
              INSERT INTO metaInfo VALUES ('molecule_stale_ct', 1, '2020-01-01 00:00:00')"
          changed_when: true

        - name: Run the custom track cleaner  # fails if `dbTrash` fails
          ansible.builtin.systemd_service:
            name: ucsc-genome-browser-custom-track-cleaner.service
            state: started

        - name: Stat the stale custom track file
          ansible.builtin.stat:
            path: "{{ ucsc_genome_browser_setting_TRASHDIR }}/ct/molecule-stale-file"
          register: stale_ct_file_stat

        - name: Look up the stale custom track table
          ansible.builtin.command:
            cmd: mysql -N customTrash -e "SHOW TABLES LIKE 'molecule_stale_ct'"
          register: stale_ct_table
          changed_when: false

        - name: Assert the custom track cleaner is enabled and removed the stale file and table
          ansible.builtin.assert:
            that:
              - custom_track_clean_timer.status.UnitFileState == "enabled"
              - custom_track_clean_timer.status.ActiveState == "active"
              - not stale_ct_file_stat.stat.exists
              - stale_ct_table.stdout == ""
            fail_msg: "The custom track cleaner timer is not active or it did not remove a stale file or table."

    - name: Ensure the genome assembly update timer is disabled
      block:
        - name: Get genome assembly update timer state
          ansible.builtin.systemd_service:
            name: ucsc-genome-browser-assembly-updater.timer
          register: data_update_timer

        - name: Assert the genome assembly update timer is disabled and not running
          ansible.builtin.assert:
            that:
              - data_update_timer.status.UnitFileState == "disabled"
              - data_update_timer.status.ActiveState == "inactive"
            fail_msg: "The genome assembly update timer should be disabled by default."

    - name: Ensure the bottleneck server is running and configured
      become: true
      block:
        - name: Get bottleneck service state
          ansible.builtin.systemd_service:
            name: ucsc-genome-browser-bottleneck.service
          register: bottleneck_service

        - name: Assert the bottleneck service is enabled and running
          ansible.builtin.assert:
            that:
              - bottleneck_service.status.UnitFileState == "enabled"
              - bottleneck_service.status.ActiveState == "active"
            fail_msg: "The bottleneck service is not enabled and active."

        - name: Read hg.conf file
          ansible.builtin.slurp:
            src: "{{ ucsc_genome_browser_setting_CGIBINDIR }}/hg.conf"
          register: hg_conf_slurp

        - name: Assert hg.conf points the CGIs at the bottleneck server
          ansible.builtin.assert:
            that:
              - "hg_conf_slurp.content | b64decode is search('^bottleneck.host=localhost$', multiline=True)"
              - "hg_conf_slurp.content | b64decode is search('^bottleneck.port=17776$', multiline=True)"
              - "hg_conf_slurp.content | b64decode is search('^bottleneck.except=192.0.2.1 192.0.2.2$', multiline=True)"
            fail_msg: "hg.conf does not point the CGIs at the bottleneck server."
