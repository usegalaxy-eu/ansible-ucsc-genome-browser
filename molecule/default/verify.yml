---
- name: Ensure UCSC Genome Browser is installed
  hosts: all
  vars_files:
    - vars.yml
  tasks:
    - name: Check if UCSC Genome Browser is already installed
      block:
        - name: Stat UCSC Genome Browser installation flag
          ansible.builtin.stat:
            path: "/usr/local/apache/cgiInstallComplete.flag"
          register: ucsc_genome_browser_installation_flag

        - name: Assert UCSC Genome Browser installation flag exists
          ansible.builtin.assert:
            that: ucsc_genome_browser_installation_flag.stat.exists
            fail_msg: "UCSC Genome Browser installation flag not found. Installation may have failed."

    - name: Ensure `/gbdb/` is a directory
      # "Work around `GBDBDIR` setting being ignored by the installation script" should have been skipped
      block:
        - name: Stat `/gbdb/` directory
          ansible.builtin.stat:
            path: /gbdb/
          register: gbdb_dir_stat

        - name: Assert that `/gbdb/` exists and is a directory
          ansible.builtin.assert:
            that:
              - gbdb_dir_stat.stat.exists
              - gbdb_dir_stat.stat.isdir
            fail_msg: "`/gbdb/` is not a directory. It should be a directory."

    - name: Ensure hg.conf settings have been applied
      block:
        - name: Read hg.conf file
          ansible.builtin.slurp:
            src: "{{ ucsc_genome_browser_setting_CGIBINDIR }}/hg.conf"
          register: hg_conf_slurp

        - name: Decode hg.conf content
          ansible.builtin.set_fact:
            hg_conf_decoded: "{{ hg_conf_slurp.content | b64decode }}"

        - name: Assert hg.conf settings
          ansible.builtin.assert:
            that: "hg_conf_decoded is search('^{{ item.key }}={{ item.value }}$', multiline=True)"
            fail_msg: "One or more hg.conf settings are missing or incorrect."
          loop: "{{ ucsc_genome_browser_hg_conf_settings | dict2items }}"

    - name: Ensure FreeType font support is enabled
      vars:
        freetype_dir_setting: "{{ hg_conf_decoded | regex_search('^freeTypeDir=(.+)$', '\\1', multiline=True) | first }}"
        # relative to the CGI directory
        freetype_dir: "{{ freetype_dir_setting if freetype_dir_setting.startswith('/') else ucsc_genome_browser_setting_CGIBINDIR ~ '/' ~ freetype_dir_setting }}"
        freetype_fonts:  # md5sums from the mirror manual
          a010013l.pfb: 5624bc04bbd862287bda3c44b15e90d6
          a010015l.pfb: 6883f53d0d140f972480f179bb5e4e3b
          a010033l.pfb: db21f79bac990fa7e3de6d4cc6f54020
          a010035l.pfb: c3d0c3af6bc183010204ca923fb98e83
          n019003l.pfb: 33265074c9c45c356f90de9cc47259b3
          n019004l.pfb: 9d07b8658622c2e0127628c87fdb9661
          n019023l.pfb: df59ecc7bd232d2355786fd644f13baa
          n019024l.pfb: 9f2d4377d9eea95dfdfa705c83a39464
          n019043l.pfb: 8f75382bd2620a20aaeb06ab8c591e8f
          n019044l.pfb: 28bb40d1700909b2509e2125a1963e2c
          n019063l.pfb: adf4d5565bec1170f0a5810c6984ff55
          n019064l.pfb: 57e1a49c39a546c2883375df12111816
          n021003l.pfb: 84e347c88eff2e77ed40b020b457bafe
          n021004l.pfb: 8721c1175d907d7d484bdaa91d4533ad
          n021023l.pfb: eef0367afaa10b929e528c40c980b941
          n021024l.pfb: 7af41ff3536fadcdc27eb9e5cc1c32d3
          n022003l.pfb: db95b702b81c12df1f91d15c8a6c3191
          n022004l.pfb: e97c9af68414fabe157af711b7691df7
          n022023l.pfb: f13fb8e581426a1ffa5fc12b10ad0f34
          n022024l.pfb: f3cd9244150f086434b62d5c5bb559b0
          z003034l.pfb: 30aef717b7c68a6b6b7760b764fbd01c
      block:
        - name: Assert FreeType is turned on in hg.conf
          ansible.builtin.assert:
            that:
              - hg_conf_decoded is search('^freeType=on$', multiline=True)
              - hg_conf_decoded is search('^freeTypeDir=.+$', multiline=True)
            fail_msg: "hg.conf does not turn on FreeType font rendering or does not set the font directory."

        - name: Stat FreeType font files
          ansible.builtin.stat:
            path: "{{ freetype_dir }}/{{ item.key }}"
            get_checksum: true
            checksum_algorithm: md5
          loop: "{{ freetype_fonts | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          register: freetype_font_stats

        - name: Assert FreeType font files are present and intact
          ansible.builtin.assert:
            that:
              - item.stat.exists
              - item.stat.checksum == item.item.value
            fail_msg: "FreeType font {{ item.item.key }} is missing from {{ freetype_dir }} or does not match its expected md5sum."
          loop: "{{ freetype_font_stats.results }}"
          loop_control:
            label: "{{ item.item.key }}"

    - name: Ensure API is served via short URLs, as on the public website
      block:
        - name: Query a non-API path
          ansible.builtin.uri:
            url: http://localhost/nonexistent-api-path
            follow_redirects: none
            status_code: 404
          register: api_non_api_response

        - name: Query the API through its CGI program
          ansible.builtin.uri:
            url: http://localhost/cgi-bin/hubApi/list/ucscGenomes
            return_content: true
          register: api_cgi_response

        - name: Query the API through its short URL
          ansible.builtin.uri:
            url: http://localhost/list/ucscGenomes
            return_content: true
            follow_redirects: none
          register: api_short_url_response

        - name: Assert the short URL answers the same as the CGI program and allows cross-origin requests
          ansible.builtin.assert:
            that:
              - api_non_api_response.status == 404  # non-API paths should not work
              - api_short_url_response.status == 200
              - "'ucscGenomes' in api_short_url_response.json"
              - api_short_url_response.json.ucscGenomes == api_cgi_response.json.ucscGenomes
              - api_short_url_response.access_control_allow_origin == "*"
            fail_msg: "`/list/ucscGenomes` does not answer the same as `/cgi-bin/hubApi/list/ucscGenomes`, or lacks CORS headers or non-API path does not return 404."

        - name: Query a non-API path on the API subdomain
          ansible.builtin.uri:
            url: http://localhost/nonexistent-api-path
            headers:
              Host: api.genome-browser
            return_content: true
            follow_redirects: none
          register: api_subdomain_catch_all_response

        - name: Query the API through its CGI program on API subdomain
          ansible.builtin.uri:
            url: http://localhost/cgi-bin/hubApi/list/ucscGenomes
            headers:
              Host: api.genome-browser
            return_content: true
          register: api_subdomain_cgi_response

        - name: Query the API through its short URL on API subdomain
          ansible.builtin.uri:
            url: http://localhost/list/ucscGenomes
            headers:
              Host: api.genome-browser
            return_content: true
            follow_redirects: none
          register: api_subdomain_short_url_response

        - name: Assert the API subdomain serves the API and its documentation
          ansible.builtin.assert:
            that:
              - api_subdomain_catch_all_response.status == 200
              - "'hubApi' in api_subdomain_catch_all_response.content"
              - api_subdomain_cgi_response.status == 200
              - api_subdomain_short_url_response.status == 200
              - api_subdomain_short_url_response.json.ucscGenomes == api_cgi_response.json.ucscGenomes
              - api_subdomain_short_url_response.access_control_allow_origin == "*"
            fail_msg: "The `api.` subdomain does not serve the API, its CORS headers, or the API documentation, or the catch-all leaks onto the main hostname."

    - name: Ensure the software update timer is enabled and running
      block:
        - name: Get software update timer state
          ansible.builtin.systemd_service:
            name: ucsc-genome-browser-cgi-updater.timer
          register: cgi_update_timer

        - name: Assert the software update timer is enabled and running
          ansible.builtin.assert:
            that:
              - cgi_update_timer.status.UnitFileState == "enabled"
              - cgi_update_timer.status.ActiveState == "active"
            fail_msg: "The software update timer should be enabled by default."

    - name: Ensure the trash cleaner timer is enabled and running
      block:
        - name: Get trash cleaner timer state
          ansible.builtin.systemd_service:
            name: ucsc-genome-browser-trash-cleaner.timer
          register: clean_timer

        - name: Assert the trash cleaner timer is enabled and running
          ansible.builtin.assert:
            that:
              - clean_timer.status.UnitFileState == "enabled"
              - clean_timer.status.ActiveState == "active"
            fail_msg: "The trash cleaner timer is not enabled and active."

    - name: Ensure the trash cleaner removes stale files
      become: true
      block:
        - name: Create a stale file in the trash directory
          ansible.builtin.file:
            path: "{{ ucsc_genome_browser_setting_TRASHDIR }}/molecule-stale-file"
            state: touch
            access_time: "202001010000.00"
            modification_time: "202001010000.00"

        - name: Run the trash cleaner
          ansible.builtin.systemd_service:
            name: ucsc-genome-browser-trash-cleaner.service
            state: started

        - name: Stat the stale file
          ansible.builtin.stat:
            path: "{{ ucsc_genome_browser_setting_TRASHDIR }}/molecule-stale-file"
          register: stale_file_stat

        - name: Assert the stale file was removed
          ansible.builtin.assert:
            that: not stale_file_stat.stat.exists
            fail_msg: "The trash cleaner did not remove a file older than one day."

    - name: Ensure the genome assembly update timer is disabled
      block:
        - name: Get genome assembly update timer state
          ansible.builtin.systemd_service:
            name: ucsc-genome-browser-assembly-updater.timer
          register: data_update_timer

        - name: Assert the genome assembly update timer is disabled and not running
          ansible.builtin.assert:
            that:
              - data_update_timer.status.UnitFileState == "disabled"
              - data_update_timer.status.ActiveState == "inactive"
            fail_msg: "The genome assembly update timer should be disabled by default."
