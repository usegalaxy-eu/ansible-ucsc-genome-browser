---
- name: Create UCSC Genome Browser backup directory
  ansible.builtin.file:
    path: "{{ ucsc_genome_browser_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"  # `hgcentral` holds password hashes

- name: Install UCSC Genome Browser backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: /usr/local/bin/ucsc-genome-browser-backup
    owner: root
    group: root
    mode: "0700"

- name: Install UCSC Genome Browser backup units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/ucsc-genome-browser-{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - backup.service
    - backup.timer

- name: Enable UCSC Genome Browser backup timer
  ansible.builtin.systemd_service:
    name: ucsc-genome-browser-backup.timer
    enabled: "{{ ucsc_genome_browser_backup_enabled }}"
    state: "{{ 'started' if ucsc_genome_browser_backup_enabled else 'stopped' }}"
    daemon_reload: true
