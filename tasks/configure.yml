---
- name: Apply UCSC Genome Browser hg.conf settings
  community.general.ini_file:
    path: "{{ ucsc_genome_browser_setting_CGIBINDIR }}/hg.conf"
    section: null  # hg.conf is a flat key=value file with no sections
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    state: present
  loop: "{{ ucsc_genome_browser_hg_conf_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Apply UCSC Genome Browser private hg.conf settings
  when: ucsc_genome_browser_hg_conf_private_settings | length > 0
  block:
    - name: Write hg.conf.private
      ansible.builtin.copy:
        dest: "{{ ucsc_genome_browser_setting_CGIBINDIR }}/hg.conf.private"
        content: |
          {% for key, value in ucsc_genome_browser_hg_conf_private_settings.items() %}
          {{ key }}={{ value }}
          {% endfor %}
        owner: root
        group: apache
        mode: "0640"
      no_log: true

    - name: Include hg.conf.private in hg.conf
      ansible.builtin.lineinfile:
        path: "{{ ucsc_genome_browser_setting_CGIBINDIR }}/hg.conf"
        line: include hg.conf.private

- name: Serve the UCSC Genome Browser API also via short URLs
  ansible.builtin.blockinfile:
    path: /etc/httpd/conf.d/001-browser.conf  # created by installation script
    marker: "# {mark} ANSIBLE MANAGED BLOCK: UCSC Genome Browser API short URLs"
    insertbefore: "^</VirtualHost>"
    block: "{{ lookup('ansible.builtin.template', 'hubApi.conf.j2') }}"
    state: "{{ 'present' if ucsc_genome_browser_api_short_urls_enabled else 'absent' }}"
  notify: Reload Apache

- name: Set up Plausible analytics
  vars:
    plausible_enabled: "{{ ucsc_genome_browser_plausible_domain | default('', true) | length > 0 }}"
  block:
    - name: Ensure `addJs` is not also set in `ucsc_genome_browser_hg_conf_settings`
      ansible.builtin.assert:
        that: "'addJs' not in ucsc_genome_browser_hg_conf_settings"
        fail_msg: "Plausible analytics needs the hg.conf `addJs` key for itself."
      when: plausible_enabled

    - name: Manage Plausible analytics script
      ansible.builtin.template:
        src: plausible.js.j2
        dest: "{{ ucsc_genome_browser_setting_HTDOCDIR | replace('$APACHEDIR', ucsc_genome_browser_setting_APACHEDIR) }}/js/plausible.js"
        mode: "0644"
      when: plausible_enabled

    - name: Manage Plausible analytics script in hg.conf
      community.general.ini_file:
        path: "{{ ucsc_genome_browser_setting_CGIBINDIR }}/hg.conf"
        section: null
        option: addJs
        value: plausible.js
        exclusive: false  # leave other `addJs` values alone
        no_extra_spaces: true
        state: "{{ 'present' if plausible_enabled else 'absent' }}"

    - name: Remove Plausible analytics script
      ansible.builtin.file:
        path: "{{ ucsc_genome_browser_setting_HTDOCDIR | replace('$APACHEDIR', ucsc_genome_browser_setting_APACHEDIR) }}/js/plausible.js"
        state: absent
      when: not plausible_enabled
