---
- name: Install `dbTrash`, which expires custom track tables
  ansible.builtin.get_url:
    url: "{{ ucsc_genome_browser_dbtrash_url }}"
    dest: /usr/local/bin/dbTrash
    owner: root
    group: root
    mode: "0755"

- name: Create the custom track usage table, which `dbTrash` expects
  # same schema as `createMetaInfo()` in kent/src/hg/lib/customTrack.c, which
  # otherwise only runs when the first custom track is loaded
  ansible.builtin.command:
    cmd: >-
      {{ ucsc_genome_browser_setting_MYSQL }} customTrash -e
      "CREATE TABLE IF NOT EXISTS metaInfo (name varchar(255) not null,
      useCount int not null, lastUse datetime not null, PRIMARY KEY(name))"
  changed_when: false

- name: Get the MariaDB socket path
  # the installer comments out the sockets in hg.conf on EL, and `dbTrash`
  # falls back to the wrong default
  ansible.builtin.command:
    cmd: "{{ ucsc_genome_browser_setting_MYSQL }} -NBe 'SELECT @@socket'"
  register: ucsc_genome_browser_mysql_socket
  changed_when: false

- name: Install UCSC Genome Browser custom track cleanup units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/ucsc-genome-browser-{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - custom-track-cleaner.service
    - custom-track-cleaner.timer

- name: Enable UCSC Genome Browser custom track cleanup timer
  ansible.builtin.systemd_service:
    name: ucsc-genome-browser-custom-track-cleaner.timer
    enabled: "{{ ucsc_genome_browser_custom_tracks_clean_enabled }}"
    state: "{{ 'started' if ucsc_genome_browser_custom_tracks_clean_enabled else 'stopped' }}"
    daemon_reload: true
