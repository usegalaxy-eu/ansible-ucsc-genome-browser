name: Setup Molecule
description: Prepare a GitHub-hosted runner to run Ansible Molecule tests.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: astral-sh/setup-uv@v10.1.0
      with:
        activate-environment: true

    - name: Restore cache (APT)
      uses: actions/cache@v6
      with:
        path: ~/.apt-cache
        key: setup-molecule-v1-${{ runner.os }}-${{ runner.arch }}-apt-${{ github.run_id }}
        restore-keys: setup-molecule-v1-${{ runner.os }}-${{ runner.arch }}-apt-

    - name: Restore cache (Vagrant plugins)
      uses: actions/cache@v6
      with:
        path: |
          ~/.vagrant.d/gems
          ~/.vagrant.d/plugins.json
        key: setup-molecule-v1-${{ runner.os }}-${{ runner.arch }}-vagrant-plugins-${{ github.run_id }}
        restore-keys: setup-molecule-v1-${{ runner.os }}-${{ runner.arch }}-vagrant-plugins-

    - name: Restore cache (Vagrant boxes)
      uses: actions/cache@v6
      with:
        path: ~/.vagrant.d/boxes
        key: setup-molecule-v1-${{ runner.os }}-${{ runner.arch }}-vagrant-boxes-${{ hashFiles('molecule/base.yml') }}

    - name: Restore cache (Ansible collections)
      uses: actions/cache@v6
      with:
        path: ~/.ansible/collections
        key: setup-molecule-v1-${{ runner.os }}-${{ runner.arch }}-ansible-collections-${{ github.run_id }}
        restore-keys: setup-molecule-v1-${{ runner.os }}-${{ runner.arch }}-ansible-collections-

    - name: Install the required Python packages
      shell: bash
      run: uv pip install -r requirements.txt -r molecule/requirements.txt

    - name: Install Vagrant and libvirt
      shell: bash
      run: |
        mkdir -p "$HOME/.apt-cache/partial"

        curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(. /etc/os-release && echo "$VERSION_CODENAME") main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
        sudo apt-get update
        sudo apt-get -o Dir::Cache::Archives="$HOME/.apt-cache" install --yes libvirt-daemon-system libvirt-dev qemu-system-x86 vagrant

    - name: Ensure cached packages not owned by root
      shell: bash
      run: sudo chown -R $USER:$USER ~/.apt-cache

    - name: Enable and start the libvirt service, authorize access to KVM and libvirt socket
      shell: bash
      run: |
        sudo systemctl enable --now libvirtd
        sudo chmod a+rw /dev/kvm /var/run/libvirt/libvirt-sock

    - name: Initialize Molecule libvirt storage pool
      shell: bash
      run: |
        sudo virsh pool-define-as molecule dir --target /var/lib/libvirt/images
        sudo virsh pool-start molecule
        sudo virsh pool-autostart molecule

    - name: Install the libvirt Vagrant provider
      shell: bash
      run: |
        if ! vagrant plugin list | grep -q 'vagrant-libvirt'; then
          vagrant plugin install vagrant-libvirt
        else
          echo "vagrant-libvirt is already installed. Skipping build."
        fi

    - name: Install `community.vagrant` Ansible collection
      shell: bash
      run: ansible-galaxy collection install community.vagrant

    - name: Download Vagrant box
      shell: bash
      run: |
        # for each Vagrant box needed for Molecule tests
        yq -r '.platforms[] | select(.box != null) | .box + "|" + (.box_version // "0")' molecule/base.yml | while IFS='|' read -r box version; do
          # download box if not already available
          regex_str="^${box}[[[:space:]]+\([^,]+,[[:space:]]+${version}.*\)$"
          if ! vagrant box list | grep -Eq "$regex_str"; then
            echo "Downloading box ${box} ${version}..."
            vagrant box add "$box" --provider libvirt --box-version "$version"
          else
            echo "Box ${box} ${version} is already available."
          fi 
        done
