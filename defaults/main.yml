# the installation script.
ucsc_genome_browser_setting_APACHEDIR: "{{ undef() }}"
ucsc_genome_browser_setting_HTDOCDIR: "{{ undef() }}"
ucsc_genome_browser_setting_CGIBINDIR: "{{ undef() }}"
ucsc_genome_browser_setting_TRASHDIR: "{{ undef() }}"
ucsc_genome_browser_setting_MYSQLDIR: "{{ undef() }}"
ucsc_genome_browser_setting_MYSQLADMIN: "{{ undef() }}"
ucsc_genome_browser_setting_MYSQLUSER: "{{ undef() }}"
ucsc_genome_browser_setting_MYSQL: "{{ undef() }}"
ucsc_genome_browser_setting_SET_MYSQL_ROOT: "{{ undef() }}"
ucsc_genome_browser_setting_HGDOWNLOAD: "{{ undef() }}"
ucsc_genome_browser_setting_GBDBDIR: "{{ undef() }}"
ucsc_genome_browser_setting_SEDINPLACE: "{{ undef() }}"
ucsc_genome_browser_setting_UDRURL: "{{ undef() }}"
ucsc_genome_browser_setting_RSYNC: "{{ undef() }}"
ucsc_genome_browser_setting_RSYNCOPTS: "{{ undef() }}"
ucsc_genome_browser_setting_COMPLETEFLAG: "{{ undef() }}"
ucsc_genome_browser_setting_ONLYGENOMES: "{{ undef() }}"
ucsc_genome_browser_setting_APTERR: "{{ undef() }}"
# ---- END GLOBAL SETTINGS ----
ucsc_genome_browser_hg_conf_settings: {}
