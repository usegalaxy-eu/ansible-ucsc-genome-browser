ucsc_genome_browser_setup_script: https://raw.githubusercontent.com/ucscGenomeBrowser/kent/master/src/product/installer/browserSetup.sh
ucsc_genome_browser_setup_script_checksum: "{{ undef() }}"  # e.g. "sha256:e47cd21c479a53d3157a4cd54f867dc26420d5f825d0b6954257e3ee3054882d"

ucsc_genome_browser_offline_mode: false
# Offline mode: data is loaded only from the local Mysql database and file system.
# On-the-fly mode: data is loaded from UCSC when not present locally.

ucsc_genome_browser_assemblies: all  # e.g. ["mm10", "wuhCor1"]
ucsc_genome_browser_assemblies_env: "{{ undef() }}"  # set environment variables (e.g. `OS=linux MACH=x86_64`) to workaround bugs

# ---- GLOBAL SETTINGS ----
# Your setting is not listed here? Don't worry, they are just placeholders!
# This role will automatically pick up any setting starting with
# "ucsc_genome_browser_setting_" supported by the UCSC Genome Browser
# installation script. Any undefined settings will use the default value from
# the installation script.
ucsc_genome_browser_setting_APACHEDIR: "{{ undef() }}"
ucsc_genome_browser_setting_HTDOCDIR: "{{ undef() }}"
ucsc_genome_browser_setting_CGIBINDIR: "{{ undef() }}"
ucsc_genome_browser_setting_TRASHDIR: "{{ undef() }}"
ucsc_genome_browser_setting_MYSQLDIR: "{{ undef() }}"
ucsc_genome_browser_setting_MYSQLADMIN: "{{ undef() }}"
ucsc_genome_browser_setting_MYSQLUSER: "{{ undef() }}"
ucsc_genome_browser_setting_MYSQL: "{{ undef() }}"
ucsc_genome_browser_setting_SET_MYSQL_ROOT: "{{ undef() }}"
ucsc_genome_browser_setting_HGDOWNLOAD: "{{ undef() }}"
ucsc_genome_browser_setting_GBDBDIR: "{{ undef() }}"
ucsc_genome_browser_setting_SEDINPLACE: "{{ undef() }}"
ucsc_genome_browser_setting_UDRURL: "{{ undef() }}"
ucsc_genome_browser_setting_RSYNC: "{{ undef() }}"
ucsc_genome_browser_setting_RSYNCOPTS: "{{ undef() }}"
ucsc_genome_browser_setting_COMPLETEFLAG: "{{ undef() }}"
ucsc_genome_browser_setting_ONLYGENOMES: "{{ undef() }}"
ucsc_genome_browser_setting_APTERR: "{{ undef() }}"
# ---- END GLOBAL SETTINGS ----
ucsc_genome_browser_hg_conf_settings: {}
  # login.https: "on"  # the setup script sets this to "off", which breaks hgLogin over https

ucsc_genome_browser_setup_script_path: /usr/local/apache/browserSetup.sh
ucsc_genome_browser_clean_enabled: true
ucsc_genome_browser_clean_schedule: daily
